<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Поверка ИВК</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECEE; --surface:#FFFFFF; --sunk:#F3F5F6; --ink:#16202B; --muted:#5A6773; --line:#C8D0D6;
  --accent:#245B7A; --accent-ink:#FFFFFF; --ok:#1E7A4C; --fail:#B42318; --warn:#A15C07; --off:#98A3AD;
  --lamp-off:#CBD2D8;
  --sans:"PT Sans","Segoe UI",Arial,sans-serif; --serif:"PT Serif","Times New Roman",Times,serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12181E; --surface:#1B232B; --sunk:#151C22; --ink:#E4E9ED; --muted:#98A5B0; --line:#33404B;
  --accent:#6FA8CB; --accent-ink:#0E1419; --ok:#4CC38A; --fail:#FF6B5E; --warn:#E3A33B; --off:#5E6B76; --lamp-off:#2D3842;
}}
:root[data-theme="dark"]{
  --bg:#12181E; --surface:#1B232B; --sunk:#151C22; --ink:#E4E9ED; --muted:#98A5B0; --line:#33404B;
  --accent:#6FA8CB; --accent-ink:#0E1419; --ok:#4CC38A; --fail:#FF6B5E; --warn:#E3A33B; --off:#5E6B76; --lamp-off:#2D3842;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- header + annunciator ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding:12px 20px;max-width:1280px;margin:0 auto;flex-wrap:wrap}
.title{flex:1 1 280px;min-width:0}
.title h1{margin:0;font-size:1.25rem;line-height:1.2}
.title p{margin:2px 0 0;color:var(--muted);font-size:.875rem}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.panel{display:flex;gap:6px;padding:0 20px 12px;max-width:1280px;margin:0 auto;overflow-x:auto}
.lamp{flex:1 0 118px;display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--sunk);cursor:pointer;text-align:left}
.lamp i{width:14px;height:14px;border-radius:3px;flex:none;background:var(--lamp-off);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.lamp b{display:block;font-size:.8125rem;line-height:1.15}
.lamp span{display:block;font-size:.75rem;color:var(--muted)}
.lamp.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.lamp.fail i{background:var(--fail);box-shadow:0 0 8px var(--fail)}
.lamp.partial i{background:var(--warn)}
.lamp.off{opacity:.55}
.lamp.verdict{flex:1.4 0 170px;background:var(--surface)}
.lamp.verdict.ok{border-color:var(--ok)} .lamp.verdict.fail{border-color:var(--fail)}

/* ---------- tabs + layout ---------- */
.tabs{display:flex;gap:4px;max-width:1280px;margin:0 auto;padding:0 20px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{max-width:1280px;margin:0 auto;padding:20px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:18px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;margin-bottom:12px}
.sec-head h2{margin:0;font-size:1.0625rem;flex:1 1 360px;line-height:1.3}
.sec-head .lim{color:var(--muted);font-size:.875rem}
.ctrl{display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--muted)}
.ctrl input[type=number]{width:64px}
.switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.875rem}
.note{color:var(--muted);font-size:.875rem;margin:8px 0 0;max-width:80ch}
.muted{color:var(--muted)}
h3{font-size:1rem;margin:16px 0 8px}

.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px 18px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:.875rem;color:var(--muted)}
.fields input,.fields select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--ink)}
.checks{display:flex;flex-wrap:wrap;gap:10px 22px}

.scroll{overflow-x:auto;max-width:100%}
table.grid{border-collapse:collapse;min-width:100%;font-variant-numeric:tabular-nums}
.grid th,.grid td{border:1px solid var(--line);padding:4px 6px;text-align:center;vertical-align:middle}
.grid th{background:var(--sunk);font-weight:400;font-size:.875rem;line-height:1.25}
.grid td.name{background:var(--sunk);white-space:nowrap}
.grid td.span{background:var(--sunk);font-size:.875rem}
.grid input{width:100%;min-width:92px;border:1px solid transparent;background:transparent;padding:6px 6px;text-align:right;border-radius:4px}
.grid input:hover{border-color:var(--line)}
.grid input:focus{background:var(--sunk);border-color:var(--accent);outline:none}
.grid input.given{color:var(--muted)}
.out{min-width:96px;text-align:right!important;white-space:nowrap;font-weight:700}
.out.ok{color:var(--ok)} .out.fail{color:var(--fail);background:color-mix(in srgb,var(--fail) 10%,transparent)}
.out.empty,.out.off{color:var(--off);font-weight:400}
.comp{font-size:.8125rem;color:var(--muted);font-weight:400;text-align:left!important;white-space:normal}
tr.na td{opacity:.45}
.fixed{color:var(--muted)}

/* ---------- protocol sheet (preview + print) ---------- */
.sheet-wrap{overflow-x:auto}
.sheet{background:#fff;color:#000;font:12pt/1.35 var(--serif);width:210mm;min-height:297mm;margin:0 auto;padding:18mm 14mm 18mm 22mm;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.sheet h4{text-align:center;font-weight:400;margin:0}
.sheet .pt{text-align:center;font-weight:700;margin:14px 0 0}
.sheet .fl{margin:4px 0 4px 40px}
.sheet .u{display:inline-block;min-width:38mm;border-bottom:1px solid #000;padding:0 4px}
.sheet .u.w{min-width:95mm}
.sheet .cap{margin:14px 0 4px}
.sheet .sh{font-weight:700;text-align:center;margin:16px 0 8px}
.sheet table{border-collapse:collapse;width:100%;font-size:11pt;page-break-inside:avoid;break-inside:avoid}
.sheet th,.sheet td{border:1px solid #000;padding:3px 5px;text-align:center;vertical-align:middle;font-weight:400}
.sheet td.l{text-align:left}
.sheet .sig{margin-top:18px}
.sheet .hint{font-size:9pt;display:block;text-align:center}
.pb{break-before:page;page-break-before:always}
#print{display:none}
@media print{
  @page{size:A4;margin:16mm 12mm 16mm 20mm}
  body{background:#fff}
  .top,.tabs,main{display:none!important}
  #print{display:block}
  #print .sheet{box-shadow:none;width:auto;min-height:0;padding:0;margin:0}
}
@media (max-width:640px){
  .bar{padding:10px 14px} main{padding:14px} .panel,.tabs{padding-left:14px;padding-right:14px}
  section.card{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.dev{display:flex;flex-direction:column;gap:2px;font-size:.75rem;color:var(--muted)}
.dev select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--ink);font-size:.9375rem;font-weight:700}
.lamp{flex:1 0 112px}
.grid td.l{text-align:left}
.grid input.txt{text-align:left;min-width:130px}
.grid td.name input{text-align:center;min-width:80px}
.grid input.ok{color:var(--ok);font-weight:700}
.grid input.fail{color:var(--fail);font-weight:700;background:color-mix(in srgb,var(--fail) 10%,transparent)}
.lims{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 10px}
.lims label{display:flex;align-items:center;gap:6px;font-size:.875rem;color:var(--muted)}
.lims input{width:90px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--sunk);color:var(--ink);text-align:right}
.part{margin:6px 2px 12px;font-size:1rem;color:var(--muted);font-weight:700;max-width:90ch}
.sheet .rh{display:flex;justify-content:space-between;border-bottom:1px solid #000;margin-bottom:10px;font-size:11pt}
.sheet .sp{letter-spacing:.18em}
.sheet td.l{text-align:left}
.sheet .brk{page-break-inside:auto;break-inside:auto}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <label class="dev">Тип ИВК
      <select id="device" aria-label="Тип ИВК">
        <option value="imc03">ИМЦ-03</option>
        <option value="imc07">ИМЦ-07</option>
        <option value="oct">ОКТОПУС-Л</option>
      </select>
    </label>
    <div class="title">
      <h1 id="hTitle">Поверка ИВК</h1>
      <p id="hSub"></p>
    </div>
    <button class="btn" id="btnReset" type="button">Новый протокол</button>
    <button class="btn primary" id="btnPrint" type="button">Печать протокола</button>
  </div>
  <div class="panel" id="panel" role="list" aria-label="Состояние разделов"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
</div>
<main id="app"></main>
<div id="print"></div>
<script>
(function(){
"use strict";
const KEY="ivk-poverka-v2", KEY_OLD="imc03-protocol-v1";
const LIM={t11:0.015,t12:0.002,t13:0.025,t14:0.01,t15:0.01,t16:0.01};
const G1=[[690,.00130],[700,.00126],[710,.00123],[720,.00119],[730,.00116],[740,.00113],[750,.00109],[760,.00106],[770,.00103],[780,.00100],[790,.00097],[800,.00094],[810,.00092],[820,.00089],[830,.00086],[840,.00084],[850,.00081],[860,.00079],[870,.00076],[880,.00074],[890,.00072],[900,.00070],[910,.00067],[920,.00065],[930,.00063],[940,.00061],[950,.00059],[960,.00057],[970,.00055],[980,.00053],[990,.00052]];
const G2={"Нефть":1.2e-3,"Бензин":1.0e-3,"Керосин":0.7e-3,"Дизельное топливо":0.65e-3};
const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

/* ---------- helpers ---------- */
const num=s=>{if(s===undefined||s===null)return NaN;const t=String(s).trim().replace(/\s/g,"").replace(",",".");return t===""?NaN:Number(t)};
const ok=x=>Number.isFinite(x);
const fmt=(x,d)=>ok(x)?x.toFixed(d).replace(".",",").replace(/^-(0,0+)$/,"$1"):"";
const shw=s=>s===undefined||s===null?"":String(s).replace(".",",");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sb=(a,b)=>`${a}<sub>${b}</sub>`;
const NB="&nbsp;";
const pv=v=>v!==""&&v!==undefined&&v!==null?esc(shw(v)):NB;
const fv=o=>o&&ok(o.v)?fmt(o.v,o.d):NB;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,parseInt(n)||a));
function stOf(v,lim){return ok(v)?(Math.abs(v)<=lim+1e-12?"ok":"fail"):"empty"}
function agg(list,used){
  if(!used) return "off";
  list=list.filter(s=>s!=="skip");
  if(list.includes("fail")) return "fail";
  if(list.length===0||list.every(s=>s==="empty")) return "empty";
  if(list.some(s=>s==="empty"||s==="nolim")) return "partial";
  return "ok";
}
function betaFor(r){if(!ok(r)||r<690||r>=1000)return NaN;for(let i=G1.length-1;i>=0;i--) if(r>=G1[i][0]) return G1[i][1];return NaN}
const dateRu=(d,year=true)=>{if(!d)return year?`«____» ________________ 20__ г.`:`«_____» ___________________________`;const[y,mo,da]=d.split("-");return `«${da}» ${MONTHS[+mo-1]} ${y} г.`};
function overall(T){const used=Object.values(T).filter(s=>s!=="off");if(!used.length)return "empty";if(used.includes("fail"))return "fail";if(used.some(s=>s!=="ok"))return "partial";return "ok";}

/* =====================================================================
   ИМЦ-03 (МИ 2587-2005)
   ===================================================================== */
let S;
function fresh03(){
  return {
    meta:{no:"",zav:"",vyp:"",own:"",place:"",etType:"УПВА",etNo:"",who:"",date:"",verdict:"auto"},
    comp:{POR:true,PMR:false,PP:true,PU:true,EPOR:false,EPMR:false},
    product:"Нефть", ppType:"freq",
    use:{t11:true,t12:true,t13:true,t14:true,t15:false,t16:false},
    t11:[], n11:2, t12:[], n12:1, t13:[], n13:2,
    t14:{f:"1000",nd:"1000",p1:["","",""],p2:["","",""],pair2:false},
    t15:{fe:"1001",fp:"1000",rows:[{np:"",ne:""},{np:"",ne:""},{np:"",ne:""}]},
    t16:{fp:"1000",fe:"1001",k:2,rows:[0,1,2].map(()=>({np:"",ne:["",""]}))},
    rhoMin:"",
    t22:{PR:io(),PP:io(),PU:io(),EPR:io()},
    t23:{PR:io(),PP:io(),PU:io(),EPR:io()},
    t24:{tmin:"",tmax:"",rmin:"",rmax:""},
    t25:{imin:"4",imax:"20",rmin:"",rmax:""}
  };
}
function io(){return {imin:"4",imax:"20",xmin:"",xmax:""}}
function shape03(){
  S.n11=clamp(S.n11,1,64); S.n12=clamp(S.n12,1,32); S.n13=clamp(S.n13,1,32);
  while(S.t11.length<S.n11) S.t11.push([{d:"4",m:""},{d:"12",m:""},{d:"20",m:""}]); S.t11.length=S.n11;
  while(S.t12.length<S.n12) S.t12.push([{d:"100",m:""},{d:"100000",m:""}]); S.t12.length=S.n12;
  while(S.t13.length<S.n13) S.t13.push({f:"1000",nd:"100000",m:["","",""]}); S.t13.length=S.n13;
  S.t16.k=clamp(S.t16.k,2,6);
  S.t16.rows.forEach(r=>{while(r.ne.length<S.t16.k) r.ne.push(""); r.ne.length=S.t16.k;});
}
const TITLES={
  t11:["1.1","Постоянный ток","Таблица 1.1 — Результаты определения погрешности измерений постоянного тока",`${sb("Δ","Iивк")} = ± 0,015 мА`],
  t12:["1.2","Период и частота","Таблица 1.2 — Результаты определения погрешности измерений периода и частоты импульсного сигнала",`${sb("δ","Tивк")} = ± 0,002 %, ${sb("δ","fивк")} = ± 0,002 %`],
  t13:["1.3","Количество импульсов","Таблица 1.3 — Результаты определения погрешности измерений количества импульсов",`${sb("δ","Nивк")} = ± 0,025 %`],
  t14:["1.4","Импульсы за интервал","Таблица 1.4 — Результаты определения погрешности измерений количества импульсов за интервал времени",`${sb("δ","NTивк")} = ± 0,01 %`],
  t15:["1.5","Отношение, один ЭПР","Таблица 1.5 — Результаты определения погрешности измерений отношения количества импульсов за интервал времени (для одного ЭПР (КПР))",`${sb("δ","RNTивк")} = ± 0,01 %`],
  t16:["1.6","Отношение, несколько ЭПР","Таблица 1.6 — Результаты определения погрешности измерений отношения количества импульсов за интервал времени (для нескольких ЭПР (КПР))",`${sb("δ","RNTивк")} = ± 0,01 %`],
  t26:["2.6","Преобразование в величины","",""]
};
function compute03(){
  const O={}, T={}, info={}; let L;
  L=[]; S.t11.forEach((inp,j)=>inp.forEach((c,i)=>{const v=num(c.m)-num(c.d);const st=stOf(v,LIM.t11);L.push(st);O[`t11-${j}-${i}`]={v,st,d:4};}));
  T.t11=agg(L,S.use.t11);
  L=[]; S.t12.forEach((inp,j)=>inp.forEach((c,i)=>{const d=num(c.d);const v=(num(c.m)-d)/d*100;const st=stOf(v,LIM.t12);L.push(st,st);O[`t12-${j}-${i}`]={v,st,d:5};O[`t12f-${j}-${i}`]={v,st,d:5};}));
  T.t12=agg(L,S.use.t12);
  L=[]; S.t13.forEach((inp,j)=>{const nd=num(inp.nd);inp.m.forEach((m,i)=>{const v=(num(m)-nd)/nd*100;const st=stOf(v,LIM.t13);L.push(st);O[`t13-${j}-${i}`]={v,st,d:4};});});
  T.t13=agg(L,S.use.t13);
  L=[]; {const nd=num(S.t14.nd);["p1","p2"].forEach(p=>{S.t14[p].forEach((m,i)=>{const v=(num(m)-nd)/nd*100;const st=stOf(v,LIM.t14);if(p==="p1"||S.t14.pair2)L.push(st);O[`t14-${p}-${i}`]={v,st,d:4};});});}
  T.t14=agg(L,S.use.t14);
  L=[]; {const r=num(S.t15.fp)/num(S.t15.fe);S.t15.rows.forEach((x,i)=>{const v=(num(x.np)/num(x.ne)-r)/r*100;const st=stOf(v,LIM.t15);L.push(st);O[`t15-${i}`]={v,st,d:4};});}
  T.t15=agg(L,S.use.t15);
  L=[]; {const k=S.t16.k,r=num(S.t16.fp)/(k*num(S.t16.fe));S.t16.rows.forEach((x,i)=>{const vals=x.ne.map(num);const sum=vals.every(ok)?vals.reduce((a,b)=>a+b,0):NaN;const v=(num(x.np)/sum-r)/r*100;const st=stOf(v,LIM.t16);L.push(st);O[`t16-${i}`]={v,st,d:4};});}
  T.t16=agg(L,S.use.t16);

  const rhoMin=num(S.rhoMin), beta=betaFor(rhoMin), gamma=G2[S.product];
  const d28=o=>(num(o.xmax)-num(o.xmin))/(num(o.imax)-num(o.imin))*0.015;
  const dt={},dp={};
  for(const k of ["PR","PP","PU","EPR"]){dt[k]=d28(S.t22[k]);dp[k]=d28(S.t23[k]);O[`dt-${k}`]={v:dt[k],st:ok(dt[k])?"ok":"empty",d:5,plain:1};O[`dp-${k}`]={v:dp[k],st:ok(dp[k])?"ok":"empty",d:6,plain:1};}
  const a=S.t24; const drF=(num(a.rmax)-num(a.rmin))/(num(a.tmax)-num(a.tmin))*(0.002/100)*num(a.tmax);
  const b=S.t25; const drI=(num(b.rmax)-num(b.rmin))/(num(b.imax)-num(b.imin))*0.015;
  const drho=S.ppType==="freq"?drF:drI;
  O["drF"]={v:drF,st:ok(drF)?"ok":"empty",d:5,plain:1}; O["drI"]={v:drI,st:ok(drI)?"ok":"empty",d:5,plain:1};
  O["beta"]={v:beta,st:ok(beta)?"ok":"empty",d:5,plain:1};
  const Dt=(x,y,nx,ny)=>{const m=[];if(!ok(beta))m.push("ρ ППmin");if(!ok(dt[x]))m.push("t "+nx);if(!ok(dt[y]))m.push("t "+ny);return m.length?{m}:{v:100*beta*Math.hypot(dt[x],dt[y])}};
  const Dp=(x,y,nx,ny)=>{const m=[];if(!ok(dp[x]))m.push("P "+nx);if(!ok(dp[y]))m.push("P "+ny);return m.length?{m}:{v:100*gamma*Math.hypot(dp[x],dp[y])}};
  const Dr=()=>{const m=[];if(!ok(rhoMin))m.push("ρ ППmin");if(!ok(drho))m.push(S.ppType==="freq"?"табл. 2.4":"табл. 2.5");return m.length?{m}:{v:drho/rhoMin*100}};
  const comb=(base,parts)=>{const miss=[].concat(...parts.map(p=>p.m||[]));if(miss.length)return {v:NaN,miss:[...new Set(miss)]};return {v:1.1*Math.sqrt(base*base+parts.reduce((s,p)=>s+p.v*p.v,0)),parts}};
  const c=S.comp;
  const R26=[
    {id:"V",  txt:`Относительная погрешность преобразования входных сигналов в значение объема продукта (ПОР), ${sb("δ","V")}, %`, lim:0.025, app:c.POR, f:()=>({v:0.025,konst:"формула (7): δV = δNивк"})},

    {id:"KvE", txt:`Относительная погрешность преобразования входных сигналов в значение коэффициента преобразования ПОР при поверке (КМХ) по ЭПОР (КПОР), ${sb("δ","Kv")}, %`, lim:0.025, app:c.POR&&c.EPOR, f:()=>{const t=Dt("EPR","PR","ЭПР","ПР"),p=Dp("EPR","PR","ЭПР","ПР");return Object.assign(comb(0.01,[t,p]),{lab:["δt","δP"],fr:"(16)–(18)"})}},

    {id:"KmE", txt:`Относительная погрешность преобразования входных сигналов в значение коэффициента преобразования ПМР при поверке (КМХ) по ЭПОР (КПОР) и ПП, ${sb("δ","Км")}, %`, lim:0.04, app:c.PMR&&c.EPOR&&c.PP, f:()=>{const r=Dr(),t=Dt("PP","EPR","ПП","ЭПР"),p=Dp("PP","EPR","ПП","ЭПР");return Object.assign(comb(0.01,[r,t,p]),{lab:["δρ","δt","δP"],fr:"(24)–(27)"})}},

  ];
  L=[];
  R26.forEach(r=>{
    if(!r.app){r.st="off";O[`r26-${r.id}`]={v:NaN,st:"off",d:4,txtOff:"не применяется"};info[r.id]="";return;}
    const res=r.f(); r.v=res.v; r.st=stOf(res.v,r.lim); L.push(r.st);

const rel=(a,b)=>(a-b)/b*100;

function gEnsure(sp,st){
  let d=st.tables[sp.id];
  if(!d) d=st.tables[sp.id]={n:sp.defN||1,groups:[],vals:{},lims:{}};
  if(sp.type==="meas"){
    d.n=sp.fixed?1:clamp(d.n,1,sp.maxN||64);
    if(sp.dyn) d.k=clamp(d.k??sp.dyn.def,sp.dyn.min,sp.dyn.max);
    const nr=sp.sections?sp.sections.reduce((a,s)=>a+s.rows,0):sp.rowsPer;
    const nc=sp.comps?2:1;
    while(d.groups.length<d.n){const g={g:{},lim:"",rows:[]};(sp.gcols||[]).forEach(c=>g.g[c.key]=c.def||"");if(sp.nameEdit)g.g.name="";d.groups.push(g);}
    d.groups.length=d.n;
    d.groups.forEach(g=>{
      while(g.rows.length<nr){const i=g.rows.length;const r={r:{},c:[]};(sp.rcols||[]).forEach(c=>r.r[c.key]=(c.defs&&c.defs[i])||"");g.rows.push(r);}
      g.rows.length=nr;
      g.rows.forEach(r=>{while(r.c.length<nc) r.c.push({}); r.c.length=nc;});
    });
  } else if(sp.type==="flat"){
    sp.rows.forEach(row=>row!=="PB"&&row.forEach(c=>{if(c.i&&d.vals[c.i]===undefined) d.vals[c.i]=c.def||"";}));
  }
}
function cMeas(sp,d,st,O){
  const nc=sp.comps?2:1, act=sp.comps&&st.meta.nComp==="1"?1:nc, L=[];
  const mc=sp.mcols(d), oc=sp.ocols(d);
  d.groups.forEach((g,gi)=>{
    const G=numObj(g.g), lim=sp.lim!=null?sp.lim:num(g.lim);
    g.rows.forEach((row,ri)=>{
      const R=numObj(row.r);
      const offRow=sp.optLast&&!d[sp.optLast.key]&&ri>=sp.sections[0].rows;
      for(let ci=0;ci<nc;ci++){
        const cell=row.c[ci], m={}; mc.forEach(c=>m[c.key]=num(cell[c.key]));
        oc.forEach(o=>{
          const v=o.manual?num(cell[o.key]):o.calc({g:G,r:R,m,k:d.k});
          const s=!ok(v)?"empty":!ok(lim)?"nolim":stOf(v,lim);
          O[`${sp.id}|${gi}|${ri}|${ci}|${o.key}`]={v,st:s,d:o.d};
          if(ci<act&&!offRow) L.push(s);
        });
      }
    });
  });
  return L;
}
function cFlat(sp,d,st,O){
  const L=[], Vn=numObj(d.vals);
  sp.rows.forEach(row=>row!=="PB"&&row.forEach(c=>{
    if(c.chk===undefined&&!c.o) return;
    const id=`${sp.id}|${c.i||c.oid}`; let v=NaN,s;
    if(typeof c.chk==="function"){ s=c.chk(d.vals,st); }
    else{
      v=c.o?c.o(Vn):num(d.vals[c.i]);
      const lim=c.chk===undefined?NaN:typeof c.chk==="number"?c.chk:num(d.lims[c.chk]);
      s=!ok(v)?(sp.optional?"skip":"empty"):c.chk===undefined?"plain":!ok(lim)?"nolim":stOf(v,lim);

const gin=(E,path,val,cls="",txt=false)=>E?`<input ${txt?"":'inputmode="decimal"'} data-path="${path}" value="${esc(val??"")}" class="${cls}" aria-label="${path}">`:pv(val);

  const table=sp.type==="meas"?rMeas(sp,d,st,"edit"):rFlat(sp,d,st,"edit");
  return `<section class="card" id="s-${sp.id}"><div class="sec-head"><h2>${sp.cap}</h2>${lim}${ctrls}</div>${lims}<div class="scroll">${table}</div>${sp.note?`<p class="note">${sp.note}</p>`:""}</section>`;
}
function makeGen(def){
  const specs=def.items.filter(x=>x.type==="meas"||x.type==="flat");
  const checked=specs.filter(x=>x.type==="meas"||x.check);
  const M={
    id:def.id,label:def.label,title:def.title,subtitle:def.subtitle,words:def.words,verdictLine:def.verdictLine,
    tabs:def.tabs,
    fresh(){const st={meta:Object.assign({verdict:"auto",nComp:"2",date:""},def.meta),use:{},tables:{}};specs.forEach(sp=>{if(sp.toggle)st.use[sp.id]=true;});return st;},
    shape(){const st=STORE[def.id];specs.forEach(sp=>gEnsure(sp,st));},
    compute(){
      const st=STORE[def.id],O={},T={};
      specs.forEach(sp=>{const d=st.tables[sp.id];const L=sp.type==="meas"?cMeas(sp,d,st,O):cFlat(sp,d,st,O);if(checked.includes(sp))T[sp.id]=agg(L,sp.toggle?st.use[sp.id]!==false:true);});
      const lamps=checked.map(sp=>({key:sp.id,num:sp.num,name:sp.name,st:T[sp.id],jump:sp.tab+"|"+sp.id}));
      return {O,T,V:overall(T),lamps,info:{}};
    },
    view(tab,C){
      const st=STORE[def.id];
      if(tab==="meta") return def.metaView(st);
      if(tab==="doc") return viewDoc(M);
      return def.items.filter(x=>x.tab===tab).map(x=>{
        if(x.type==="text") return x.app===false?"":`<p class="part">${x.appHtml||x.html}</p>`;
        if(x.type==="pb") return "";
        return gCard(M,x,st);
      }).join("");
    },
    sheet(C){
      const st=STORE[def.id];
      let h=def.header(st);
      def.items.forEach(x=>{
        if(x.type==="text") h+=`<p class="${x.cls||"cap"}">${x.html}</p>`;
        else if(x.type==="pb") h+=`<div class="pb"></div>`;
        else{
          const used=!x.toggle||st.use[x.id]!==false;
          h+=`<p class="cap">${x.pcap||x.cap}</p>`;
          h+=x.type==="meas"?rMeas(x,st.tables[x.id],st,used?"print":"blank",C.O):rFlat(x,st.tables[x.id],st,used?"print":"blank",C.O);
        }
      });
      return h+def.footer(st,C);
    }
  };
  return M;
}
function metaFields(st,fields,extra=""){
  const m=st.meta;
  const f=([k,l,type])=>type==="comp"
    ?`<label>${l}<select data-path="meta.${k}" data-rr><option value="2" ${m[k]!=="1"?"selected":""}>два компьютера</option><option value="1" ${m[k]==="1"?"selected":""}>один компьютер</option></select></label>`
    :`<label>${l}<input type="${type||"text"}" data-path="meta.${k}" value="${esc(m[k]??"")}"></label>`;
  return `<section class="card"><div class="sec-head"><h2>Реквизиты протокола</h2></div><div class="fields">${fields.map(f).join("")}</div>${extra}</section>`;
}

const MODS={imc03:MOD03,imc07:MOD07,oct:MODOC};
function freshStore(){return {device:"imc03",tab:{imc03:"meta",imc07:"meta",oct:"meta"},imc03:fresh03(),imc07:MOD07.fresh(),oct:MODOC.fresh()}}
function loadStore(){
  const fs=freshStore();
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const x=JSON.parse(raw);fs.device=MODS[x.device]?x.device:"imc03";Object.assign(fs.tab,x.tab||{});
      if(x.imc03) fs.imc03=Object.assign(fresh03(),x.imc03);
      if(x.imc07) fs.imc07=Object.assign(MOD07.fresh(),x.imc07,{meta:Object.assign(MOD07.fresh().meta,x.imc07.meta||{})});
      if(x.oct) fs.oct=Object.assign(MODOC.fresh(),x.oct,{meta:Object.assign(MODOC.fresh().meta,x.oct.meta||{})});
      return fs;}
    const old=localStorage.getItem(KEY_OLD);
    if(old){const x=JSON.parse(old);delete x.tab;fs.imc03=Object.assign(fresh03(),x);}
  }catch(e){}
  return fs;
}
let STORE=loadStore(); S=STORE.imc03;
function save(){try{localStorage.setItem(KEY,JSON.stringify(STORE))}catch(e){}}
const M=()=>MODS[STORE.device];
const cur=()=>STORE[STORE.device];
const curTab=()=>STORE.tab[STORE.device];

function viewDoc(mod){
  const st=STORE[mod.id],v=st.meta.verdict;
  const sel=mod.verdictLine?`<label class="ctrl">Заключение: <select data-path="meta.verdict"><option value="auto" ${v==="auto"?"selected":""}>по результатам расчета</option><option value="yes" ${v==="yes"?"selected":""}>${mod.words[0]}</option><option value="no" ${v==="no"?"selected":""}>${mod.words[1]}</option></select></label>`:"";
  return `<section class="card"><div class="sec-head"><h2>Протокол для печати</h2>${sel}<button class="btn primary" type="button" data-print>Печать протокола</button></div><p class="note" id="docNote"></p></section><div class="sheet-wrap"><div class="sheet" id="preview"></div></div>`;
}
const ST={ok:"в норме",fail:"превышение",empty:"не заполнено",partial:"заполнено частично",off:"не проводится"};
function panel(C){
  const mod=M();
  const items=C.lamps.map(l=>`<button type="button" class="lamp ${l.st}" data-jump="${l.jump}" role="listitem"><i></i><span><b>${l.num} ${l.name}</b><span>${ST[l.st]}</span></span></button>`).join("");
  const vt={ok:mod.words[0],fail:mod.words[1],partial:"есть незаполненные разделы",empty:"данных нет"}[C.V];
  return items+`<button type="button" class="lamp verdict ${C.V==="ok"?"ok":C.V==="fail"?"fail":"partial"}" data-jump="doc|" role="listitem"><i></i><span><b>Заключение</b><span>${vt}</span></span></button>`;
}
const app=document.getElementById("app");
function render(){
  const mod=M(); mod.shape();
  const C=mod.compute(), tab=curTab();
  document.getElementById("hTitle").textContent=mod.title;
  document.getElementById("hSub").textContent=mod.subtitle;
  document.getElementById("device").value=STORE.device;
  document.title=mod.title;
  document.getElementById("tabs").innerHTML=mod.tabs.map(([id,l])=>`<button class="tab" role="tab" data-tab="${id}" aria-selected="${id===tab}">${l}</button>`).join("");
  app.innerHTML=mod.view(tab,C);
  refresh(C);
}
function refresh(C){
  const mod=M(); C=C||mod.compute();
  document.getElementById("panel").innerHTML=panel(C);
  app.querySelectorAll("[data-out]").forEach(el=>{
    const o=C.O[el.dataset.out]; if(!o) return;
    el.className="out "+(o.plain&&o.st==="ok"?"":o.plain&&o.st==="plain"?"":o.st);
    el.textContent=o.st==="off"?(o.txtOff||"—"):ok(o.v)?fmt(o.v,o.d):"—";
  });
  app.querySelectorAll("[data-chk]").forEach(el=>{const o=C.O[el.dataset.chk];el.classList.remove("ok","fail");if(o&&(o.st==="ok"||o.st==="fail"))el.classList.add(o.st);});
  app.querySelectorAll("[data-info]").forEach(el=>{el.textContent=C.info[el.dataset.info]||"";});
  const pvw=document.getElementById("preview"); if(pvw) pvw.innerHTML=mod.sheet(C);
  const dn=document.getElementById("docNote");
  if(dn){const bad=C.lamps.filter(l=>l.st==="fail").map(l=>l.num),inc=C.lamps.filter(l=>l.st==="empty"||l.st==="partial").map(l=>l.num);
    dn.textContent=(bad.length?`Превышение пределов: таблицы ${bad.join(", ")}. `:"")+(inc.length?`Не заполнены до конца или без предела: таблицы ${inc.join(", ")}. `:"")+(!bad.length&&!inc.length?"Все проводимые определения заполнены и находятся в пределах допуска.":"");}
  return C;
}
function setPath(path,val){const p=path.split(".");let o=cur();for(let i=0;i<p.length-1;i++){if(o[p[i]]===undefined)o[p[i]]={};o=o[p[i]];}o[p[p.length-1]]=val;}
app.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.path&&t.type!=="checkbox"&&t.type!=="number"){setPath(t.dataset.path,t.value);save();if(t.hasAttribute("data-rr")){render();return;}refresh();}
});
app.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.check){setPath(t.dataset.check,t.checked);save();t.hasAttribute("data-rr")?render():refresh();}
  else if(t.dataset.count){setPath(t.dataset.count,t.value);save();render();}
});
app.addEventListener("click",e=>{if(e.target.closest("[data-print]"))doPrint();});
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;STORE.tab[STORE.device]=b.dataset.tab;save();render();window.scrollTo(0,0);});
document.getElementById("panel").addEventListener("click",e=>{
  const b=e.target.closest("[data-jump]");if(!b)return;const[tab,anchor]=b.dataset.jump.split("|");
  STORE.tab[STORE.device]=tab;save();render();
  const el=anchor&&document.getElementById("s-"+anchor); if(el) el.scrollIntoView({block:"start"}); else window.scrollTo(0,0);
});
document.getElementById("device").addEventListener("change",e=>{STORE.device=e.target.value;save();render();window.scrollTo(0,0);});
function doPrint(){document.getElementById("print").innerHTML=`<div class="sheet">${M().sheet(M().compute())}</div>`;window.print();}
document.getElementById("btnPrint").addEventListener("click",doPrint);
document.getElementById("btnReset").addEventListener("click",()=>{
  const mod=M();
  if(confirm(`Очистить все данные протокола ${mod.label} и начать новый?`)){STORE[mod.id]=mod.fresh();STORE.tab[mod.id]="meta";if(mod.id==="imc03")S=STORE.imc03;save();render();}
});
render();
